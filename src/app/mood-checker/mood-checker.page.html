<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    <ion-title class="header">wellness check</ion-title>
  </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [ngClass]="moodColor" class="center-content"> 
  <br>

 <ion-card class="mood-card">
    <ion-card-header>
      <ion-card-title>How are you feeling today?</ion-card-title>
    </ion-card-header>
    <ion-card-content>

  <ion-list>
    <ion-radio-group [(ngModel)]="status"> <!-- data binding to get mood -->
    <ion-item>
    <ion-label class="custom-label">Joy</ion-label>
    <ion-radio slot="end" value="Joy"></ion-radio>
    </ion-item>

    <ion-item>
    <ion-label class="custom-label">Anxiety</ion-label>
    <ion-radio slot="end" value="Anxiety"></ion-radio>
    </ion-item>

    <ion-item>
      <ion-label class="custom-label">Emotional</ion-label>
      <ion-radio slot="end" value="Emotional"></ion-radio>
    </ion-item>

    <ion-item>
    <ion-label class="custom-label">Frustrated</ion-label>
    <ion-radio slot="end" value="Frustrated"></ion-radio>
    </ion-item>

    <ion-item>
    <ion-label class="custom-label">Calm</ion-label>
    <ion-radio slot="end" value="Calm"></ion-radio>
    </ion-item>

    <ion-item>
      <ion-label class="custom-label">Meh</ion-label>
      <ion-radio slot="end" value="Meh"></ion-radio>
      </ion-item>

    </ion-radio-group>
    </ion-list>
    <ion-button class="custom-button" (click)="onButtonClick()">Save</ion-button>
    </ion-card-content>
  </ion-card>

</ion-content>
