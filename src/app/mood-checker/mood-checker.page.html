<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    <ion-title class="header">Mood-Checker</ion-title>
  </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [ngStyle]="{'--background': backgroundColor}"> 
  <br>
 
  <ion-list>
    <ion-radio-group [(ngModel)]="status">
    <ion-item>
    <ion-label>Joy</ion-label>
    <ion-radio slot="end" value="Joy"></ion-radio>
    </ion-item>

    <ion-item>
    <ion-label>Anxiety</ion-label>
    <ion-radio slot="end" value="Anxiety"></ion-radio>
    </ion-item>

    <ion-item>
    <ion-label>Frustrated</ion-label>
    <ion-radio slot="end" value="Frustrated"></ion-radio>
    </ion-item>

    <ion-item>
    <ion-label>Calm</ion-label>
    <ion-radio slot="end" value="Calm"></ion-radio>
    </ion-item>

    <ion-item>
      <ion-label>Meh</ion-label>
      <ion-radio slot="end" value="Meh"></ion-radio>
      </ion-item>

    </ion-radio-group>
    </ion-list>
    <ion-button (click)="onButtonClick()">Save</ion-button>
    
</ion-content>
