<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    <ion-title class="header">History</ion-title>
  </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <br>
    <ion-card class="history-card" *ngFor="let group of groupedGratitudes">
      <ion-card-header>
        <ion-card-title>You were grateful for...</ion-card-title>
        <ion-card-subtitle>{{ group.date | date:'mediumDate' }}</ion-card-subtitle>
      </ion-card-header>*
      <ion-card-content>
        <ion-list>
          <ion-item *ngFor="let entry of group.entries">
            {{ entry }} <!-- data binding -->
          </ion-item>
        </ion-list>
      </ion-card-content>
</ion-card>


</ion-content>
