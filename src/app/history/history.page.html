<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    <ion-title>History</ion-title>
  </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <br>
    <ion-card>
      <ion-card-header>
        <ion-card-title>You were grateful for...</ion-card-title>
        <ion-card-subtitle>(date)</ion-card-subtitle>
      </ion-card-header>*

      <div *ngFor="let input of gratitudeInputs">

      <ion-card-content>
        <ion-list>
          <ion-item>
            {{ input.text }} <!-- data binding -->
          </ion-item>
        </ion-list>
      </ion-card-content>
      <ion-datetime></ion-datetime>
  </div>
</ion-card>


</ion-content>
