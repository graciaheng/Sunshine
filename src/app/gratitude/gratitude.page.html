<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
      <ion-title class="header">Gratitude</ion-title>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <br>
<ion-title class="custom-title">What are you grateful for today?</ion-title>

<!-- dynamic list of inputs -->
<ion-list class="gratitude-list">
  <ion-item *ngFor="let input of gratitudeInputs; let i = index">
    <ion-input
      [(ngModel)]="input.text"
      label=""
      labelPlacement="stacked"
      [clearInput]="true"
      placeholder="I am grateful for... "
    >
    </ion-input>
  </ion-item>

</ion-list>

<div class="circle-button-wrapper">
  <ion-fab horizontal="end"> <!-- move the button to the right side of the page -->
    <ion-fab-button class="custom-circle-button" (click)="addGratitude()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</div>

<div class="button-wrapper">
  <ion-button class="custom-button" (click)="onDoneButtonClicked()">Done</ion-button>
</div>


</ion-content>
