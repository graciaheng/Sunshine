<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title class="header">
      Home
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-menu contentId="main-content" class="custom-menu">
  <ion-header>
    <ion-toolbar>
      <ion-title class="custom-label">Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list>
      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/home" routerDirection="root">
          <ion-label class="custom-label" >Home</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/mood-checker" routerDirection="forward">
          <ion-label class="custom-label">Wellness Check</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/gratitude" routerDirection="forward">
          <ion-label class="custom-label">Practise Gratitude</ion-label>
        </ion-item></ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/history" routerDirection="forward">
          <ion-label class="custom-label">Gratitude History</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/sleep-helper" routerDirection="forward">
          <ion-label class="custom-label">For Deep Sleep</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="true">
        <ion-item routerLink="/settings" routerDirection="forward">
          <ion-label class="custom-label">Settings</ion-label>
        </ion-item>
      </ion-menu-toggle>

    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="ion-padding"  id="main-content"> 

    <div style="text-align: start;"> 
      <ion-title class="custom-title">Hey {{myUsername}}!</ion-title>
    </div>

    <br> 

    <div class="custom-quote"> 
      <ol>
        <ul *ngFor ="let d of quote"> <p> {{d.quote}} </p> </ul>
        <ul *ngFor ="let d of quote"> <p> {{d.author}} </p> </ul>
      </ol>
    </div>

    <br>

<ion-card class="mood-checker-card">
  <ion-card-header>
      <ion-card-title class="custom-card-title">wellness check</ion-card-title>
  </ion-card-header>
    
  <ion-card-content class="custom-text">
    Happy.. Sad..
  </ion-card-content>
    
  <div class="button-wrapper">
    <ion-button class="custom-button" [routerLink]="['/mood-checker']">Enter</ion-button>
  </div>
</ion-card>

<br> 

<ion-card class="gratitude-card">
  <ion-card-header>
    <ion-card-title class="custom-card-title">practise gratitude</ion-card-title>
  </ion-card-header>

  <ion-card-content class="custom-text">
    I am grateful for..
  </ion-card-content>

  <div class="button-wrapper">
    <ion-button class="custom-button" [routerLink]="['/gratitude']">Enter</ion-button>
  </div>
</ion-card>

<br> 

<ion-card class="sleep-card">
  <ion-card-header>
    <ion-card-title class="custom-card-title">for deep sleep</ion-card-title>
  </ion-card-header>

  <ion-card-content class="custom-text">
    Zzz Zzz Zzz
  </ion-card-content>

  <div class="button-wrapper">
    <ion-button class="custom-button" [routerLink]="['/sleep-helper']">Enter</ion-button>
  </div>
</ion-card>

<br> 

  </ion-content>
</div>
