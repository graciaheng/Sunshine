<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title class="header">
      Settings
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" id="main-content">
    <h2> Account Details </h2>
    <ion-list>
        <ion-item>
          <ion-input class="custom-label" [(ngModel)]="username" label="Username" placeholder="Enter text"></ion-input>
        </ion-item>
    
        <ion-item>
          <ion-input class="custom-label"
          type="password"
          [(ngModel)]="password"
          name="password"
          #passwordRef="ngModel"
          required
          minlength="6"
          label="Password"></ion-input>
        </ion-item>
    
        <ion-item>
          <ion-input class="custom-label"
          type="email"
          [(ngModel)]="email"
          name="email"
          #emailRef="ngModel"
          required
          email
          placeholder="email@domain.com"
          label="Email input"></ion-input>
        </ion-item>
  
      </ion-list>

      <!-- error messages -->
      <div class="error-message" *ngIf="emailRef.invalid && emailRef.touched">
        <p *ngIf="emailRef.errors?.['required']">Email is required.</p>
        <p *ngIf="emailRef.errors?.['email']">Please enter a valid email address.</p>
      </div>
      <div class="error-message" *ngIf="passwordRef.invalid && passwordRef.touched">
        <p *ngIf="passwordRef.errors?.['required']">Password is required.</p>
        <p *ngIf="passwordRef.errors?.['minlength']">Password must be at least 6 characters long.</p>
      </div>

    <ion-button class="custom-button" (click)="onClickSaveDetails()">Save Details</ion-button>
</ion-content>
